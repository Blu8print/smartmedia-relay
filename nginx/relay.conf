server {
    listen 80;
    server_name relay.smartmedia.blu8print.com;

    # Let Certbot manage this block — it will add SSL redirect after cert issuance.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name relay.smartmedia.blu8print.com;

    ssl_certificate     /etc/letsencrypt/live/relay.smartmedia.blu8print.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.smartmedia.blu8print.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Limit request body to 30 MB (base64 images can be ~4 MB before encoding).
    client_max_body_size 30m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # OpenRouter calls can take a few seconds.
        proxy_read_timeout 60s;
    }
}
